<!DOCTYPE html>
<!--
  EXITLEVLS CALCULATOR — single file, no dependencies, works offline.
  How to use:
    1. Enter your entry premium (e.g. 1.00) and number of contracts.
    2. Enter your stop-loss % (e.g. 20 = exit at -20%).
    3. Add take-profit % levels (e.g. 20, 50). "Sell" is optional: enter how many
       contracts you plan to close at that level to see scale-out P/L,
       remaining contracts, and cumulative P/L.
    Results update as you type. TPs are evaluated in ascending % order.
    P/L = (exit - entry) x 100 per contract. No fees included.
  Host on GitHub Pages or just open this file in a browser.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExitLevls Calculator</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e8ec; --dim:#8a919e; --red:#ff5c5c; --green:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 20px; }
  .grid { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); }
  input { width:120px; padding:8px 10px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; font-size:15px; }
  input:focus { outline:none; border-color:#4a90e2; }
  .tp-row { display:flex; gap:12px; align-items:flex-end; margin-bottom:8px; }
  button { padding:8px 12px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--dim); }
  .x { color:var(--dim); }
  h2 { font-size:13px; color:var(--dim); font-weight:500; margin:20px 0 8px; text-transform:uppercase; letter-spacing:.05em; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--dim); font-weight:500; }
  th:first-child, td:first-child { text-align:left; }
  .stop td:first-child, .stop .price { color:var(--red); font-weight:600; }
  .tp td:first-child, .tp .price { color:var(--green); font-weight:600; }
  .neg { color:var(--red); } .pos { color:var(--green); }
  .muted { color:var(--dim); }
  .note { font-size:12px; color:var(--dim); margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>ExitLevls Calculator</h1>

  <div class="grid">
    <label>Entry premium <input id="entry" type="number" step="0.01" min="0" value="1.00"></label>
    <label>Contracts <input id="qty" type="number" step="1" min="1" value="1"></label>
    <label>Stop-loss % <input id="stop" type="number" step="1" min="0" value="20"></label>
  </div>

  <h2>Take-profits</h2>
  <div id="tps"></div>
  <button id="add">+ Add TP</button>

  <h2>Exits</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Level</th><th>Price</th><th>P/L / contract</th><th>P/L full position</th><th>Sold</th><th>P/L sold</th><th>Remaining</th><th>Cumulative P/L</th></tr>
      </thead>
      <tbody id="out"></tbody>
    </table>
  </div>
  <div class="note" id="note"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const tpsEl = $('tps');

  function addTP(pct = '', sell = '') {
    const row = document.createElement('div');
    row.className = 'tp-row';
    row.innerHTML =
      '<label>TP % <input class="tp-pct" type="number" step="1" min="0" value="' + pct + '"></label>' +
      '<label>Sell (optional) <input class="tp-sell" type="number" step="1" min="0" value="' + sell + '" placeholder="—"></label>' +
      '<button class="x" title="Remove">✕</button>';
    row.querySelector('button').onclick = () => { row.remove(); calc(); };
    tpsEl.appendChild(row);
    calc();
  }

  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
  const money = n => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
  const cls = n => n < 0 ? 'neg' : n > 0 ? 'pos' : '';

  function calc() {
    const entry = num($('entry').value);
    const qty = Math.max(0, Math.floor(num($('qty').value) || 0));
    const stopPct = num($('stop').value);
    const out = $('out');
    out.innerHTML = '';
    $('note').textContent = '';
    if (entry === null || entry <= 0) return;

    const rows = [];

    // Stop
    if (stopPct !== null) {
      const price = Math.max(0, entry * (1 - stopPct / 100));
      const per = (price - entry) * 100;
      rows.push('<tr class="stop"><td>Stop -' + stopPct + '%</td><td class="price">' + price.toFixed(2) +
        '</td><td class="' + cls(per) + '">' + money(per) + '</td><td class="' + cls(per) + '">' + money(per * qty) +
        '</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td></tr>');
    }

    // Take-profits, ascending
    const tps = [...tpsEl.querySelectorAll('.tp-row')]
      .map(r => ({ pct: num(r.querySelector('.tp-pct').value), sell: num(r.querySelector('.tp-sell').value) }))
      .filter(t => t.pct !== null)
      .sort((a, b) => a.pct - b.pct);

    let remaining = qty, cumulative = 0, capped = false;
    for (const t of tps) {
      const price = entry * (1 + t.pct / 100);
      const per = (price - entry) * 100;
      let soldCells = '<td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td>';
      if (t.sell !== null && t.sell > 0) {
        let sold = Math.floor(t.sell);
        if (sold > remaining) { sold = remaining; capped = true; }
        remaining -= sold;
        const pl = per * sold;
        cumulative += pl;
        soldCells = '<td>' + sold + '</td><td class="' + cls(pl) + '">' + money(pl) + '</td><td>' + remaining +
          '</td><td class="' + cls(cumulative) + '">' + money(cumulative) + '</td>';
      }
      rows.push('<tr class="tp"><td>TP +' + t.pct + '%</td><td class="price">' + price.toFixed(2) +
        '</td><td class="' + cls(per) + '">' + money(per) + '</td><td class="' + cls(per) + '">' + money(per * qty) +
        '</td>' + soldCells + '</tr>');
    }

    out.innerHTML = rows.join('');
    if (capped) $('note').textContent = 'Some "Sell" values exceeded remaining contracts and were capped.';
  }

  document.addEventListener('input', calc);
  $('add').onclick = () => addTP();
  addTP(20);
  addTP(50);
</script>
</body>
</html>
